<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Book a court</title>
  </head>
  <body>
    <h1>Book a court</h1>
    <p>Court 2, Saturday, 10:00 to 12:00</p>
    <p>Court fee: <output id="fee" aria-label="Court fee">$80.00</output></p>
    <form id="coupon-form">
      <label for="code">Coupon code</label>
      <input id="code" name="code" autocomplete="off" />
      <button type="submit">Apply</button>
      <p id="coupon-error" role="alert" hidden></p>
    </form>
    <script type="module">
      import { applyCoupon } from "../src/coupon.js";

      const BOOKING_CENTS = 8000;
      const COUPONS = {
        SPRING10: { kind: "percent", value: 10, minBookingCents: 5000, expires: "2099-12-31" },
        BIG20: { kind: "fixed", value: 2000, minBookingCents: 10000, expires: "2099-12-31" },
        WINTER5: { kind: "percent", value: 5, minBookingCents: 0, expires: "2020-01-31" },
      };
      const MESSAGES = {
        expired: "This coupon has expired.",
        booking_too_small: "This booking is too small for this coupon.",
        unknown_kind: "This coupon can't be used here.",
        unknown_code: "We don't know this coupon.",
      };

      const fee = document.getElementById("fee");
      const error = document.getElementById("coupon-error");

      document.getElementById("coupon-form").addEventListener("submit", (event) => {
        event.preventDefault();
        const coupon = COUPONS[document.getElementById("code").value.trim().toUpperCase()];
        error.hidden = true;
        try {
          if (!coupon) throw { reason: "unknown_code" };
          const cents = applyCoupon(coupon, BOOKING_CENTS, new Date().toISOString().slice(0, 10));
          fee.textContent = `$${(cents / 100).toFixed(2)}`;
        } catch (failure) {
          error.textContent = MESSAGES[failure.reason];
          error.hidden = false;
        }
      });
    </script>
  </body>
</html>
